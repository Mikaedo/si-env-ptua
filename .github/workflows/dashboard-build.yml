name: Build dashboard Angular

# Compilation de verification du tableau de bord. Ne publie rien : Cloudflare
# Pages a son propre pipeline connecte au meme depot.

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-build.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Installer les dependances
        run: npm ci

      - name: Compiler en production
        env:
          API_URL: https://placeholder.local
        run: npm run build:cf

      - name: Verifier la presence de config.js
        run: |
          if [ ! -f dist/dashboard/browser/assets/config.js ]; then
            echo "!! config.js manquant : le pipeline CF Pages produira un bundle sans API_URL"
            exit 1
          fi
          cat dist/dashboard/browser/assets/config.js
