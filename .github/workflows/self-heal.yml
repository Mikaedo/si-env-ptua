name: Self-heal (reparation automatique)

# Declenche sur l'ouverture d'une issue par watchdog.yml ou health-check.yml.
# Applique en cascade les reparations qu'un operateur ferait a la main :
#   1. Restart doux du service Render (via API /restart)
#   2. Health check pour verifier
#   3. Si echec : nouveau deploiement force (POST /v1/services/{id}/deploys)
#   4. Health check
#   5. Si echec : re-seed Supabase (contourne une base corrompue)
#
# Garde-fou anti-boucle : ne se declenche pas sur les issues qu'il a lui-meme
# creees, pose un label 'self-heal-tente' pour ne jamais se re-executer.

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write
  actions: write

jobs:
  soigner:
    runs-on: ubuntu-latest
    if: >
      github.event.issue.user.login == 'github-actions[bot]' &&
      !contains(github.event.issue.labels.*.name, 'self-heal-tente') &&
      (contains(github.event.issue.labels.*.name, 'watchdog') ||
       contains(github.event.issue.labels.*.name, 'health-check'))
    steps:
      - name: Marquer l'issue pour eviter la boucle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$NUM" --repo "${{ github.repository }}" \
            --add-label "self-heal-tente"

      - name: Commenter le debut du self-heal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUM" --repo "${{ github.repository }}" --body \
            "🔧 Self-heal declenche. Cascade de reparation en cours."

      # ─── Etape 1 : restart doux via API Render ────────────────────────
      - name: Restart doux du service Render
        env:
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "→ POST /v1/services/${RENDER_SERVICE_ID}/restart"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/restart")
          echo "  HTTP $code"

      - name: Attendre 60s le redemarrage
        run: sleep 60

      - name: Health check apres restart
        id: check_apres_restart
        continue-on-error: true
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          base="${RENDER_URL%/}"
          for essai in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$base/docs")
            echo "essai $essai : HTTP $code"
            if [ "$code" = "200" ]; then
              echo "vert=oui" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done
          echo "vert=non" >> "$GITHUB_OUTPUT"
          exit 1

      # ─── Etape 2 : nouveau deploiement force ───────────────────────────
      - name: Nouveau deploiement force
        if: steps.check_apres_restart.outputs.vert == 'non'
        env:
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "→ POST /v1/services/${RENDER_SERVICE_ID}/deploys (clearCache=clear)"
          curl -s -o /dev/null -w '  HTTP %{http_code}\n' \
            -X POST -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"clear"}' \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys"

      - name: Attendre 180s le redeploiement
        if: steps.check_apres_restart.outputs.vert == 'non'
        run: sleep 180

      - name: Health check apres redeploiement
        id: check_apres_redeploy
        if: steps.check_apres_restart.outputs.vert == 'non'
        continue-on-error: true
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          base="${RENDER_URL%/}"
          for essai in 1 2 3 4 5 6 7 8; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$base/docs")
            echo "essai $essai : HTTP $code"
            if [ "$code" = "200" ]; then
              echo "vert=oui" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo "vert=non" >> "$GITHUB_OUTPUT"
          exit 1

      # ─── Etape 3 : re-seed Supabase ────────────────────────────────────
      - name: Re-declencher bootstrap-supabase
        if: steps.check_apres_redeploy.outputs.vert == 'non'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run bootstrap-supabase.yml --repo "${{ github.repository }}" --ref main
          sleep 10
          rid=$(gh run list --repo "${{ github.repository }}" --workflow=bootstrap-supabase.yml \
                --limit 1 --json databaseId --jq '.[0].databaseId')
          for i in $(seq 1 30); do
            statut=$(gh run view "$rid" --repo "${{ github.repository }}" --json status --jq '.status')
            if [ "$statut" = "completed" ]; then break; fi
            sleep 10
          done
          gh run view "$rid" --repo "${{ github.repository }}" --json conclusion --jq '.conclusion'

      # ─── Cloture ─────────────────────────────────────────────────────
      - name: Rapport final et fermeture de l'issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.issue.number }}
          R: ${{ steps.check_apres_restart.outputs.vert }}
          D: ${{ steps.check_apres_redeploy.outputs.vert }}
        run: |
          if [ "$R" = "oui" ]; then
            resultat="✅ Reparation reussie a l'etape 1 (restart doux)."
            statut="ok"
          elif [ "$D" = "oui" ]; then
            resultat="✅ Reparation reussie a l'etape 2 (redeploiement force)."
            statut="ok"
          else
            resultat="⚠️ Le self-heal n'a PAS pu retablir le service apres 3 tentatives. Intervention manuelle requise."
            statut="ko"
          fi

          corps="$resultat

          - Etape 1 (restart doux Render) : $([ "$R" = "oui" ] && echo '✅' || echo '❌')
          - Etape 2 (redeploiement force) : $([ "$D" = "oui" ] && echo '✅' || ([ "$R" = "oui" ] && echo 'non necessaire' || echo '❌'))
          - Etape 3 (re-seed Supabase) : declenchee si les 2 precedentes ont echoue

          Log complet : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          gh issue comment "$NUM" --repo "${{ github.repository }}" --body "$corps"

          if [ "$statut" = "ok" ]; then
            gh issue close "$NUM" --repo "${{ github.repository }}" --reason completed
          else
            gh issue edit "$NUM" --repo "${{ github.repository }}" \
              --add-label "self-heal-en-echec"
          fi
