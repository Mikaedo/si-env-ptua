name: Verifier la connexion Supabase

# Test manuel qui verifie que la DATABASE_URL configuree pointe bien vers une
# base PostgreSQL joignable, que PostGIS y est active et que les fonctions
# spatiales sont trouvables sans qualification de schema.
#
# Se declenche uniquement a la main (workflow_dispatch) pour ne pas consommer
# de minutes CI a chaque push.

on:
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer psycopg2
        run: pip install --quiet psycopg2-binary

      - name: Tester la connexion et PostGIS
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python <<'PY'
          import os, sys, psycopg2

          url = (os.getenv("DATABASE_URL") or "").strip()
          if not url:
              print("!! DATABASE_URL manquant dans les secrets", file=sys.stderr)
              sys.exit(1)
          if (url.startswith('"') and url.endswith('"')) or \
             (url.startswith("'") and url.endswith("'")):
              url = url[1:-1]

          try:
              conn = psycopg2.connect(url)
          except Exception as e:
              print(f"!! Connexion refusee : {e}", file=sys.stderr)
              sys.exit(1)

          cur = conn.cursor()

          # Serveur atteint : afficher la version
          cur.execute("SELECT version()")
          print("Serveur :", cur.fetchone()[0])

          # search_path courant
          cur.execute("SHOW search_path")
          print("search_path courant :", cur.fetchone()[0])

          # Ou est installe PostGIS ?
          cur.execute(
              "SELECT n.nspname FROM pg_extension e "
              "JOIN pg_namespace n ON e.extnamespace = n.oid "
              "WHERE e.extname = 'postgis'"
          )
          row = cur.fetchone()
          if not row:
              print("!! Extension postgis absente de la base", file=sys.stderr)
              sys.exit(2)
          schema = row[0]
          print(f"Schema d'installation de PostGIS : {schema}")

          # Ajoute ce schema au search_path pour la session, puis re-teste
          cur.execute(f'SET search_path TO {schema}, public, extensions')
          cur.execute("SELECT postgis_version()")
          print("PostGIS :", cur.fetchone()[0])

          cur.execute("SELECT ST_AsText(ST_SetSRID(ST_MakePoint(-4.048, 5.372), 4326))")
          print("Fonctions ST_* accessibles :", cur.fetchone()[0])

          if schema not in ("public", "extensions"):
              print(
                  f"\n>>> A APPLIQUER : ajouter '?options=-c%20search_path%3D{schema}%2Cpublic%2Cextensions'\n"
                  f"    a la DATABASE_URL pour que chaque nouvelle connexion voie PostGIS."
              )

          # Combien de tables sont deja creees ?
          cur.execute(
              "SELECT count(*) FROM information_schema.tables "
              "WHERE table_schema = 'public'"
          )
          n = cur.fetchone()[0]
          print(f"Tables dans le schema public : {n}")

          cur.close()
          conn.close()
          print("\nConnexion Supabase operationnelle.")
          PY
