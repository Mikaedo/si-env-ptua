name: Watchdog (keep-alive continu)

# ─────────────────────────────────────────────────────────────────────────────
# Empeche activement la mise en veille du backend Render (endormissement au
# bout de 15 min sur le tier gratuit) et la suspension du projet Supabase
# (7 jours d'inactivite).
#
# Strategie : un job unique qui tourne 5 h 50 min et fait le ping en boucle
# serree toutes les 3 minutes. Un nouveau job demarre juste avant que le
# precedent finisse : couverture continue, sans trou entre deux relais.
#
# Retry avec backoff exponentiel, auto-restart du service Render via API si
# 3 echecs consecutifs, remontee d'une issue GitHub apres 3 echecs pour
# alerter par courriel sans intervention.
#
# Depot public → minutes GitHub Actions illimitees.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      duree_minutes:
        description: "Duree du watchdog en minutes (max 350)"
        required: false
        default: "350"

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    if: ${{ secrets.RENDER_URL != '' }}
    steps:
      - name: Boucle de surveillance
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DUREE: ${{ github.event.inputs.duree_minutes || '350' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          debut=$(date +%s)
          fin=$((debut + DUREE * 60))
          render_url="${RENDER_URL%/}/"
          render_restart="https://api.render.com/v1/services/${RENDER_SERVICE_ID}/restart"
          sb_ping="${SUPABASE_URL%/}/rest/v1/"
          echecs_rd=0
          echecs_sb=0
          n=0

          ping_render() {
            local code temps
            for essai in 1 2 3; do
              # /docs est un endpoint public et leger de FastAPI qui prouve
              # que l'application repond, pas seulement le reverse proxy.
              code=$(curl -s -o /dev/null -w '%{http_code}' \
                --max-time 90 --connect-timeout 20 "${render_url}docs" || echo "000")
              temps=$(date +%H:%M:%S)
              if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then
                echo "  [$temps] Render ok (HTTP $code, essai $essai)"
                echecs_rd=0
                return 0
              fi
              echo "  [$temps] Render KO (HTTP $code, essai $essai) — retry dans $((essai*10))s"
              sleep $((essai * 10))
            done
            echecs_rd=$((echecs_rd + 1))
            echo "  ! Render injoignable apres 3 essais (echecs consecutifs : $echecs_rd)"
            # Reveil dur : POST /v1/services/{id}/restart via l'API Render
            if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
              echo "  → tentative de restart via API Render"
              curl -s -o /dev/null -w "    HTTP %{http_code}\n" \
                -X POST -H "Authorization: Bearer $RENDER_API_KEY" \
                -H "Accept: application/json" "$render_restart" || true
            fi
            return 1
          }

          ping_sb() {
            local code temps
            for essai in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' \
                --max-time 30 --connect-timeout 10 \
                -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
                "$sb_ping" || echo "000")
              temps=$(date +%H:%M:%S)
              if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then
                echo "  [$temps] Supa   ok (HTTP $code, essai $essai)"
                echecs_sb=0
                return 0
              fi
              echo "  [$temps] Supa   KO (HTTP $code, essai $essai) — retry dans $((essai*5))s"
              sleep $((essai * 5))
            done
            echecs_sb=$((echecs_sb + 1))
            echo "  ! Supabase injoignable apres 3 essais (echecs consecutifs : $echecs_sb)"
            return 1
          }

          alerter() {
            local composant="$1" echecs="$2"
            local titre="[Watchdog] $composant injoignable ($echecs echecs consecutifs)"
            local corps="Le watchdog n'a pas pu joindre $composant apres 3 tentatives, "
            corps+="repetees $echecs fois de suite.

            Voir le run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            gh issue create --title "$titre" --body "$corps" --label "watchdog" \
              --repo "${{ github.repository }}" 2>/dev/null || true
          }

          echo "=== Watchdog demarre pour $DUREE minutes ==="
          echo "  cible Render : ${render_url}docs"
          echo "  cible Supa   : $sb_ping"
          echo

          while [ "$(date +%s)" -lt "$fin" ]; do
            n=$((n + 1))
            echo "── passe $n ─────────────────────────────"
            ping_render || true
            ping_sb || true

            if [ "$echecs_rd" -eq 3 ]; then
              alerter "Render (backend)" "$echecs_rd"
              echecs_rd=0
            fi
            if [ "$echecs_sb" -eq 3 ]; then
              alerter "Supabase" "$echecs_sb"
              echecs_sb=0
            fi

            reste=$((fin - $(date +%s)))
            if [ "$reste" -le 180 ]; then
              echo "  fin de fenetre proche ($reste s), passage au relais"
              break
            fi
            sleep 180
          done

          echo
          echo "=== Watchdog termine apres $n passes ==="
