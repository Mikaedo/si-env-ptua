name: si_env
description: SI-ENV - Suivi Environnemental PTUA
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.8 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  sqflite: ^2.4.2+1
  path: ^1.8.3
  geolocator: ^14.0.3
  image_picker: ^1.2.3
  http: ^1.6.0
  http_parser: ^4.0.2
  flutter_map: ^8.3.1
  onnxruntime: 1.4.1
  latlong2: ^0.10.1
  shared_preferences: ^2.2.0
  uuid: ^4.0.0
  intl: ^0.20.3
  permission_handler: ^12.0.3
  cupertino_icons: ^1.0.2
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  # Camera : requis par lib/screens/camera_live_screen.dart pour l'apercu
  # video en direct avec detection YOLO en superposition. Version fixee sur
  # celle deja resolue dans pubspec.lock.
  camera: ^0.12.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/shapefile/
    - assets/images/
