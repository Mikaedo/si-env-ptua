<header class="h-16 bg-white shadow-sm flex items-center justify-between px-6 border-b border-gray-200 sticky top-0 z-10">
  <!-- Search Bar -->
  <div class="flex-1 max-w-xl">
    <div class="relative group">
      <lucide-icon [img]="Search" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-navy transition-colors"></lucide-icon>
      <input type="text" placeholder="Rechercher un projet, une route..." 
             class="w-full bg-gray-50 border border-gray-200 rounded-full pl-10 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-navy-light focus:border-navy transition-all">
    </div>
  </div>

  <!-- Right Section -->
  <div class="flex items-center gap-4 ml-4">
    <!-- Notifications -->
    <button class="relative p-2 text-gray-400 hover:text-navy hover:bg-gray-50 rounded-full transition-colors">
      <lucide-icon [img]="Bell" class="w-5 h-5"></lucide-icon>
      <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-orange rounded-full border-2 border-white"></span>
    </button>

    <div class="w-px h-6 bg-gray-200"></div>

    <!-- User Profile -->
    <div class="flex items-center gap-3 cursor-pointer hover:bg-gray-50 p-1.5 rounded-lg transition-colors">
      <div class="w-8 h-8 rounded-full bg-navy-light flex items-center justify-center text-navy font-semibold">
        <lucide-icon [img]="User" class="w-4 h-4"></lucide-icon>
      </div>
      <div class="hidden md:block">
        <p class="text-sm font-medium text-gray-800">Admin CC-PTUA</p>
        <p class="text-xs text-gray-500">Superviseur</p>
      </div>
    </div>
  </div>
</header>
